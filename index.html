<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0b14" />
    <meta name="description" content="Green Leaf Hotel digital menu – app style." />
    <title>Green Leaf Hotel | Digital Menu</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Updated Header -->
      <header class="app-header">
        <h1 class="app-title">Green Leaf Hotel</h1>
        <p class="welcome-text">Welcome to our digital menu. Explore our delicious selection of freshly prepared meals.</p>
      </header>

      <!-- Search -->
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" placeholder="Search for an item or category..." aria-label="Search menu" />
      </div>

      <!-- Category Tabs (horizontal scroll) -->
      <nav class="category-tabs" aria-label="Menu categories">
        <button class="tab active" data-meal="breakfast" aria-pressed="true">Breakfast</button>
        <button class="tab" data-meal="lunch" aria-pressed="false">Lunch</button>
        <button class="tab" data-meal="dinner" aria-pressed="false">Dinner</button>
      </nav>

      <!-- Section heading -->
      <div class="section-header">
        <span class="fire-icon">🔥</span>
        <h2 class="section-title" id="section-title">Popular Breakfasts</h2>
      </div>

      <!-- Menu List -->
      <main class="menu-list" id="menu-list" aria-live="polite"></main>

      <!-- Bottom hint -->
      <p class="bottom-hint">Select an item for details and allergen information.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
